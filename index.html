<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <title>Успешная авторизация</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400..800;1,400..800&display=swap');
    </style>
    <style>
        .wix-madefor-text-medium {
            font-family: "Wix Madefor Text", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        * {
            font-family: "Abel";
            font-weight: 400;
            font-style: normal;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #383838;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            padding: 24px 16px;
            border-radius: 15px;
            color: white;
            max-width: 300px;
        }
        .container .image {
            border-radius: 10px;
            overflow: hidden;
            width: 60px;
            margin-bottom: 20px;
        }
        .container h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0;
        }
        .container p {
            font-size: 16px;
            color: #b0b0b0;
            margin: 10px 0 20px 0;
        }
        .container button {
            background-color: #eecb70;
            color: #161616;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 400;
            border-radius: 50px;
            cursor: pointer;
        }
        .container button:hover {
            background-color: #e6392d;
        }
    </style>
    <script>
        function redirectWithParams() {
            const currentParams = new URLSearchParams(window.location.search);
            const targetUrl = 'https://app.taptattoo.ru/yandex-auth';
            window.location.href = `${targetUrl}?${currentParams.toString()}`;
        }
    </script>
</head>
<body>
<div class="container">
    <svg class="image" width="60" height="60" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">

    </svg>
    <h1 class="wix-madefor-text-medium">Успешная авторизация</h1>
    <p class="wix-madefor-text-medium">Перейдите в приложение <br /> для завершения авторизации</p>
    <button class="wix-madefor-text-medium" onclick="redirectWithParams()">Продолжить</button>
</div>
</body>
</html>
